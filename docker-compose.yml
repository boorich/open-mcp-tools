services:
  mcp-rag-tools:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otto-mayer-rag-tools
    image: open-mcp-tools:rag-client
    
    # Expose MCP server port
    ports:
      - "7284:7284"
    
    # Environment configuration
    environment:
      - PYTHONUNBUFFERED=1
      - RAG_DB_DIR=/app/resources/pricelists
      # Optional: DCAP broadcasting
      # - DCAP_BROADCAST_ENABLED=true
      # - DCAP_RELAY_HOST=159.89.110.236
      # - DCAP_RELAY_PORT=10191
    
    # Volume mounts for persistent data
    volumes:
      # Mount directory for price lists and database
      # Can be overridden via environment variable PRICELISTS_DIR
      - ${PRICELISTS_DIR:-./resources/pricelists}:/app/resources/pricelists
      # Optional: Mount custom configuration
      # - ./config:/app/config:ro
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Optional: Network for multiple services
networks:
  default:
    name: mcp-network
    driver: bridge
