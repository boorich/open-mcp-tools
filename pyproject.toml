[project]
name = "open-mcp-tools"
version = "0.1.0"
description = "General-purpose MCP server with extensible tool modules, DCAP performance tracking, and x402 payments"
readme = "README.md"
authors = [
    { name = "empea-careercriminal", email = "empeamtk@googlemail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "x402>=0.1.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "watchdog>=4.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
    "openpyxl>=3.1.0",
]
keywords = ["mcp", "model-context-protocol", "tools", "tabletop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/empea-careercriminal/open-mcp-tools"
Repository = "https://github.com/empea-careercriminal/open-mcp-tools"

[project.scripts]
open-mcp-tools = "open_mcp_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
ingestion = [
    "pdfplumber>=0.10.0",
    "pypdfium2>=4.0.0",
    "PyPDF2>=3.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
