phases:
- name: Initiative bestimmen
  description: Alle Beteiligten würfeln auf Initiative (Geschicklichkeitswurf) und
    bestimmen damit die Zugreihenfolge der Kämpfenden
  order: 1
- name: Züge ausführen
  description: Jeder Kampfbeteiligte macht einen Zug in der Reihenfolge der Initiative.
    In jedem Zug kann sich ein Charakter bewegen und eine Aktion ausführen
  order: 2
- name: Runde beenden
  description: Wenn jeder Kampfbeteiligte einen Zug ausgeführt hat, endet die Runde.
    Der Kampf wird mit der nächsten Runde fortgesetzt
  order: 3
setup_steps:
- Jeder Spieler wählt einen Charakter aus den fünf beiliegenden Auswahlmöglichkeiten
- Spieler geben ihren Charakteren Namen und beschreiben ihr Aussehen
- Ein Spieler übernimmt die Rolle des Spielleiters (SL)
- Der SL macht sich mit dem Abenteuer vertraut
- Der SL legt fest, wo alle Charaktere und Monster zu Beginn stehen
- Bei Kampfbeginn wird die Überraschung festgelegt
- Alle Beteiligten würfeln auf Initiative, um die Zugreihenfolge zu bestimmen
