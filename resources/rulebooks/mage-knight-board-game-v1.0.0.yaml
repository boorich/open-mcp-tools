setup_steps:
- Ein Szenario wählen
- Spielerreihenfolge festlegen und Helden wählen
- Ruhmes- und Ansehenstafel vorbereiten - Schildplättchen auf Feld 0 legen
- Feind- und Ruinenplättchen nach Rückseiten sortieren und als verdeckte Stapel bereitlegen
- Artefaktdeck mischen und als verdeckten Stapel bereitlegen
- Verletzungsdeck als offenen Stapel bereitlegen
- Zauberdeck mischen und 3 Karten als Angebot auslegen
- Deck der Fortgeschrittenen Aktionen mischen und 3 Karten als Angebot auslegen
- Deck der normalen Einheiten und Eliteeinheiten mischen
- Einheitenangebot bilden (Anzahl Spieler + 2 Karten)
- Tag-/Nachttafel mit Tagseite nach oben auslegen
- Quelle mit Manawürfeln füllen (Anzahl Spieler + 2)
- Tag-Taktikkarten auslegen
- Stapel der Spielplanteile gemäß Szenario vorbereiten
- Startteil gemäß Szenario auslegen
- 2-3 Spielplanteile aufdecken und anlegen
- Jeder Spieler mischt sein Handlungsdeck (16 Basis-Aktionskarten)
- Jeder Spieler zieht 5 Handkarten
- Jeder Spieler legt seine Levelplättchen als Stapel bereit
- Jeder Spieler mischt seine Fähigkeitsplättchen als verdeckten Stapel
