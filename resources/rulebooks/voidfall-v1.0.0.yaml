description: Ein episches Weltraum-4X-Spiel, in dem Spieler galaktische Häuser führen
  und gegen die Leere kämpfen. Das Spiel umfasst 3 Zyklen mit Fokuskarten, Agenden,
  Technologien und Kampf gegen die Leere. Spielbar kompetitiv, kooperativ oder solo.
