phases:
- name: Vorbereitungsphase
  description: Erneuern der Fokusauslage, Alarmstapel, Technologien, Zugreihenfolge
    bestimmen und Galaktisches Ereignis aufdecken
  order: 1
- name: Fokusphase
  description: 'Mehrere Runden mit Zügen: Krise aufdecken (Koop/Solo), Fokus auswählen,
    Agieren, Aufräumen, Anwachsen der Leere (Koop/Solo)'
  order: 2
- name: Auswertungsphase
  description: Die Leere schlägt zurück (Koop/Solo), Wartung zahlen, Galaktische Bestimmungen
    erfüllen, Agendaziele überprüfen, Fokuskarten zurücknehmen
  order: 3
setup_steps:
- Galaxietableau in die Mitte legen
- Sektoren gemäß Szenario aufbauen
- Haustableaus und Ressourcentableaus vorbereiten
- Einflusstableau aufbauen
- Agendatableau mit Agendastapeln vorbereiten
- Krisentableau mit Krisenstapeln aufbauen
- Fokuskarten-Auslage bilden (3 Gemeinsame/Heroische Fokusse)
- Technologieauslage mit Basis- und Fortschrittlichen Technologien bilden
- Galaktische Ereignisse für jeden Zyklus vorbereiten
- Alarmstapel gemäß Schwierigkeitskarte vorbereiten (Koop/Solo)
- Startressourcen und Startkomponenten gemäß Szenario verteilen
- Herkunftskarten und Hausfokuskarten verteilen
- Bevölkerungswürfel in Heimatsektoren platzieren
- Startflotten einsetzen
- Zugreihenfolge für ersten Zyklus bestimmen
