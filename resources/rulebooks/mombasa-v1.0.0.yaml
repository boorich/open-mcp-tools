complexity: heavy
language: de
author: Alexander Pfister
description: Ein Strategiespiel über Handelskompanien im Zeitalter des Kolonialismus.
  Spieler erwerben Anteile an vier großen Handelskompanien (Mombasa, Cape Town, Saint-Louis,
  Cairo) und breiten deren Handelsposten über Afrika aus, um den Wert ihrer Anteile
  zu steigern.
tags:
- economic
- hand-management
- area-control
- stock-holding
- action-selection
