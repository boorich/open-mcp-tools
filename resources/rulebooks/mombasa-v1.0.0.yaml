- trading
- investment
components:
- 1 Spielplan
- 4 doppelseitige Kompanieleisten
- 72 Buchplättchen
- 10 Startplättchen
- 4 Spielerablagen
- 4 Bonusplättchen
- 44 Aktionskarten
- 60 Münzen (40x 1 Pfund, 20x 5 Pfund)
- 60 Handelsposten (je 15 in 4 Farben)
- 36 Start-Aktionskarten (9 pro Spielerfarbe)
- 16 Anteilsmarker (4 pro Spielerfarbe)
- 4 1er-Ausbreitungskarten
- 20 Bonusmarker (5 pro Spielerfarbe)
- 4 Tintenfass-Marker
- 4 Diamanten-Marker
- 4 Leistenkarten
- 1 Startspieler-Marker
- 1 Wertungsblock
- 4 Übersichten
