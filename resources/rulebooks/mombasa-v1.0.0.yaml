phases:
- name: Planungsphase
  description: Alle Spieler wählen gleichzeitig Karten aus ihren Handkarten und legen
    diese verdeckt an ihre Aktions-Slots. Danach werden alle Karten aufgedeckt.
  order: 1
- name: Allgemeine Aktionsphase
  description: 'Spieler führen reihum Spielzüge aus, indem sie eine von sechs möglichen
    Aktionen wählen: Warenkarten nutzen, Ausbreitungskarten nutzen, Buchhalter-Karte
    nutzen, Diamantenhändler-Karte nutzen, Bonusmarker setzen oder Aktionsphase beenden.'
  order: 2
- name: Vorbereitungsphase für die nächste Runde
  description: Münzen werden von der Rundenleiste zur Bücherauslage gelegt, die Kartenauslage
    wird aufgefüllt und Spieler nehmen ihre Bonusmarker zurück.
  order: 3
setup_steps:
- Legt den Spielplan in die Tischmitte
- Legt die Kompanieleisten A1, B1, C1, D1 an die entsprechenden Seiten des Spielplans
  (Mombasa schwarz, Cape Town rot, Saint-Louis weiß, Cairo orange)
- Stellt die 15 Handelsposten jeder Farbe auf die Felder in der jeweiligen Kompaniebasis
- Sortiert die 44 Aktionskarten nach Buchstaben (A-E) und bildet einen verdeckten
  Stapel (E unten, dann D, C, B, A oben)
- Füllt die 12 Felder der Kartenauslagen mit Karten vom Aktionskartenstapel (rechte
  Spalte zuerst, dann mittlere, dann linke)
- Legt die Münzen als Vorrat (Bank) neben den Spielplan
- Füllt die Felder 2-7 der Rundenleiste mit Münzen entsprechend der Spielerzahl
- Sortiert die 72 Buchplättchen nach Buchstaben (A, B, C) und legt sie als verdeckten
  Vorrat bereit
- Füllt die 12 Felder der Bücherauslage mit je 4 aufgedeckten Plättchen pro Buchstabe
- Legt die 4 Bonusplättchen rechts vom Spielplan bereit
- 'Jeder Spieler wählt eine Farbe und erhält: Spielerablage, 9 Start-Aktionskarten,
  4 Anteilsmarker, 1 Diamanten-Marker, 1 Tintenfass-Marker, 1 Pfund, Bonusmarker (2-3
  je nach Spielerzahl)'
- Bestimmt einen Startspieler und gebt ihm den Startspieler-Marker
- Jeder Spieler erhält eine bestimmte 1er-Ausbreitungskarte entsprechend seiner Spielreihenfolge
- Gebt jedem Spieler ein bestimmtes Startplättchen entsprechend seiner Spielreihenfolge
- Jeder Spieler legt sein Startplättchen offen auf das Umschlagfeld seiner Spielerablage
- Jeder Spieler stellt seinen Tintenfass-Marker auf das Tintenfass-Symbol seines Startplättchens
- Jeder Spieler legt die 3 auf seinem Startplättchen angegebenen Karten offen oberhalb
  seiner Spielerablage an die Sammel-Slots
- Jeder Spieler erhält seinen Startbonus
