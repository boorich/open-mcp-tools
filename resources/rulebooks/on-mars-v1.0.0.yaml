phases:
- name: Kolonisierungsphase
  description: In Spielerreihenfolge macht jeder Spieler einen Zug, in dem er 1 Hauptaktion
    und optional 1 Sonderaktion durchführt. Verfügbare Aktionen hängen davon ab, ob
    der Spieler im Orbit oder in der Kolonie ist.
  order: 1
- name: Shuttlephase
  description: Das Shuttle reist entweder zwischen Orbit und Kolonie oder bewegt sich
    näher zum Reisen. Spieler können mit dem Shuttle zwischen den beiden Bereichen
    des Spielplans wechseln.
  order: 2
setup_steps:
- Spielplan in die Mitte des Tisches legen
- Entdeckungsplättchen mischen und 2 aufdecken
- Warenlager mit je 3 Kristallen, Batterien, Wasser, Pflanzen und Sauerstoff füllen
  (2 im 2-Spieler-Spiel)
- Techplättchen sortieren und im Techbereich auslegen
- Bauplankarten nach Level sortieren und 6 Karten auslegen
- Wissenschaftlertableau mit 6 Wissenschaftlerkarten in festgelegter Reihenfolge bestücken
- Erdenverträge als verdeckten Stapel bereitlegen
- Startmine auf markiertes Feld in der Mitte legen
- Übrige Startgebäude zufällig auf markierte Hexfelder legen
- Gebäudeplättchen nach Typ sortieren und im Halter platzieren
- Forschungsplättchen nach Typ sortiert auf markierte Hexfelder legen
- Missionskarten auswählen (2 kurze + 1 lange oder 1 kurze + 2 lange) und auslegen
- Missionsanzeigewürfel entsprechend der Spieleranzahl platzieren
- Verbleibende-Missionen-Marker auf Feld 3 stellen
- Kolonielevelmarker auf linke Seite der zweiten Reihe stellen
- LSS-Anzeigemarker in untere Reihe legen
- 4 LSS-Belohnungsplättchen zufällig auslegen
- Jeder Spieler wählt eine Farbe und erhält Spielmaterial
- Spieler platzieren Spielermarker auf Reihenfolgeleiste und erhalten Boni
- Spieler mit höchster Nummer auf Reihenfolgeleiste platziert das Shuttle
