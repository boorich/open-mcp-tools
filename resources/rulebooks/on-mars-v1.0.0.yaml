description: Ein komplexes Strategiespiel über die Kolonisierung des Mars. Spieler
  sind Chefastronauten privater Forschungsunternehmen, die eine autarke Kolonie auf
  dem Mars aufbauen. Sie reisen zwischen der Raumstation im Orbit und der Planetenoberfläche,
  bauen Gebäude, entwickeln Technologien und erfüllen Missionen.
